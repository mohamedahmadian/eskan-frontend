name: Deploy Eskan Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |
            set -e

            cd /var/www/eskan-frontend

            OLD_COMMIT=$(git rev-parse HEAD)

            echo "📥 Pulling latest code..."
            git pull --ff-only origin main

            CHANGED_FILES=$(git diff --name-only "$OLD_COMMIT" HEAD)

            if echo "$CHANGED_FILES" | grep -qE '^(package.json|package-lock.json)$'; then
              echo "📦 Dependencies changed → npm install"
              npm install
            else
              echo "⏭️ Dependencies unchanged → skip npm install"
            fi

            echo "♻️ Restarting frontend..."
            pm2 restart eskan-frontend-dev

            echo "✅ Deployment completed!"
